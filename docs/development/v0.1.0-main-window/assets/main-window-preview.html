  <div class="preview-tools"><div><strong>HTML 布局预览</strong><span class="tool-note">视觉与控件以 <a href="https://main--6a5a658b3681fcc010430db5.chromatic.com/?path=/docs/sakani-design-system--docs" target="_blank" rel="noopener noreferrer">Sakani</a> 为准，数据仅为演示。</span></div><label for="scenario">状态示例<select id="scenario"><option value="normal">正常</option><option value="warming">采样中</option><option value="stale">数据过期</option><option value="error">采集失败</option><option value="denied">权限不足</option><option value="unsupported">不支持</option></select></label></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
  (() => {
    'use strict';
    const $ = (selector) => document.querySelector(selector);
    const icon = (name, extra = '') => `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const labels = { overview: '总览', cpu: 'CPU', memory: '内存', network: '网络', settings: '设置' };
    const stateLabels = { normal: '正常状态', warming: '正在采样', stale: '数据已过期', error: '采集失败', denied: '权限不足', unsupported: '当前不支持', offline: '网卡未连接' };
    const stateHelp = { warming: '正在建立采样基线，获得有效样本后再显示读数。', stale: '保留上次有效值，历史断档不会用零值补齐。', error: '这是一条采集失败示例，不代表你的设备发生故障。', denied: '当前权限无法读取此项数据，其他指标可继续显示。', unsupported: '当前环境没有提供该项能力，不生成零值曲线。', offline: '所选演示网卡未连接，不静默切换到其他接口。' };
    const state = { page: 'overview', range: 5, scenario: 'normal', applied: { theme: 'system', interval: '1', network: 'auto' }, draft: null };
    const cpu = Array.from({length:61}, (_, i) => Math.max(7, 19 + Math.sin(i * .52) * 6 + Math.sin(i * .19) * 4 + (i > 18 && i < 25 ? 42 - Math.abs(21-i)*9 : 0) + (i > 41 && i < 47 ? 25-Math.abs(44-i)*8 : 0)));
    const memory = Array.from({length:61}, (_, i) => 43.8 + i * .03 + Math.sin(i * .25) * .45);
    const download = Array.from({length:61}, (_, i) => Math.max(.3, 2.5 + Math.sin(i*.28)*1.5 + Math.sin(i*.92)*.55 + (i > 32 ? 2.2 : 0)));
    const upload = Array.from({length:61}, (_, i) => Math.max(35, 155 + Math.sin(i*.45)*65 + Math.sin(i*.12)*35 + (i>38 ? 60 : 0)));
    cpu[60] = 18.4; memory[60] = 14.6/32*100; download[60] = 5.82; upload[60] = 268;
    const series = { cpu, memory, download, upload };
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    let chartId = 0;
    let toastTimer;
    const networkName = () => state.applied.network === 'wifi' ? 'Wi-Fi' : '以太网';
    const statusFor = (kind) => (kind === 'network' || kind === 'download' || kind === 'upload') && state.applied.network === 'wifi' ? 'offline' : state.scenario;
    const hasValue = (kind) => ['normal', 'stale'].includes(statusFor(kind));
    const dataFor = (kind) => (state.range === 1 ? series[kind].slice(-13) : series[kind]);
    const lastValue = (kind) => ({ cpu:'18.4', memory:'14.6', download:'5.82', upload:'268' }[kind]);
    const numberValue = (kind) => hasValue(kind) ? lastValue(kind) : '—';
    const average = (kind) => (dataFor(kind).reduce((sum, value) => sum + value, 0) / dataFor(kind).length).toFixed(1);
    function statusChip(kind) { const status = statusFor(kind); return `<span class="status-chip ${status === 'normal' ? '' : status === 'error' || status === 'denied' ? 'error' : 'warning'}"><span class="small-dot"></span>${status === 'normal' ? '状态正常' : stateLabels[status]}</span>`; }
    function pathFor(values, max, width=600, height=170) { return values.map((value, index) => `${index ? 'L' : 'M'}${(index/(values.length-1)*width).toFixed(2)},${(height - Math.min(max,Math.max(0,value))/max*height).toFixed(2)}`).join(' '); }
    function spark(kind, muted=false) { if (!hasValue(kind)) return ''; const values = series[kind].slice(-25); const max = kind === 'memory' ? 60 : Math.max(...values)*1.1; return `<svg class="spark ${muted ? 'muted' : ''}" viewBox="0 0 600 170" preserveAspectRatio="none" aria-hidden="true"><path d="${pathFor(values,max)}" fill="none" stroke="currentColor" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`; }
    function chart(kind, options={}) {
      const max = options.max || (kind==='cpu' || kind==='memory' ? 100 : kind==='download' ? 8 : 400);
      const unit = options.unit || (kind==='cpu' || kind==='memory' ? '%' : kind==='download' ? ' MB/s' : ' KB/s');
      const values = dataFor(kind), status = statusFor(kind), id = `fill-${++chartId}`;
      const ticks = [max,max*.75,max*.5,max*.25,0].map(value => Number.isInteger(value) ? value : value.toFixed(1));
      const grid = [0,42.5,85,127.5,170].map(y=>`<line x1="0" x2="600" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join('');
      const visible = status==='normal';
      const mainPath = pathFor(values,max);
      const path = visible ? `<path d="${mainPath} L600,170 L0,170 Z" fill="url(#${id})"/><path d="${mainPath}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` : '';
      const second = options.compare && visible ? `<path d="${pathFor(dataFor('memory'),100)}" fill="none" stroke="var(--chart-muted)" stroke-width="1.7" vector-effect="non-scaling-stroke"/>` : '';
      return `<div class="chart" role="img" aria-label="${options.compare ? 'CPU 与内存' : labels[kind] || (kind==='download'?'下载':'上传')}最近 ${state.range} 分钟演示趋势${visible?'':'，'+stateLabels[status]}"><div class="chart-labels">${ticks.map((tick,i)=>`<span>${tick}${i===0?unit:''}</span>`).join('')}</div><svg class="chart-plot" viewBox="0 0 600 170" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".15"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".015"/></linearGradient></defs>${grid}${second}${path}</svg><div class="chart-times"><span>${state.range===5?'5 分钟前':'60 秒前'}</span><span>${state.range===5?'2 分 30 秒前':'30 秒前'}</span><span>示例当前</span></div>${visible?'':`<div class="empty-chart">${icon('info')}<strong>${stateLabels[status]}</strong><span>${status==='stale'?'上次有效读数保留，当前趋势已中断':'等待有效数据后再绘制趋势'}</span></div>`}</div>`;
    }
    function heading(title, subtitle, ranges=true) { return `<div class="page-heading"><div><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div>${ranges ? `<div class="heading-actions"><div class="period-control" role="group" aria-label="趋势时间范围"><button data-range="1" aria-pressed="${state.range===1}">1 分钟</button><button data-range="5" aria-pressed="${state.range===5}">5 分钟</button></div></div>` : ''}</div>`; }
    function banner(kind) { const status = statusFor(kind); return status==='normal' ? '' : `<div class="state-banner">${icon('info')}<div><strong>${stateLabels[status]} · </strong>${stateHelp[status]}</div></div>`; }
    function metric(kind, name, unit, note, target) { return `<button class="metric-card" data-go="${target}" aria-label="查看${name}详情"><span class="metric-top">${icon(kind==='download'?'down':kind==='upload'?'up':kind)}<span>${name}</span>${icon('arrow','metric-arrow')}</span><span class="metric-value number" ${statusFor(kind)==='stale'?'style="color:var(--secondary)"':''}>${numberValue(kind)}<span class="metric-unit">${hasValue(kind)?unit:''}</span></span><span class="metric-bottom"><span class="metric-note">${hasValue(kind)?note:stateLabels[statusFor(kind)]}</span>${spark(kind,kind==='memory'||kind==='upload')}</span></button>`; }
    function rows(items) { return `<dl class="data-rows">${items.map(([label,value])=>`<div class="data-row"><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`; }
    function legendItem(label, value, secondary=false) { return `<span class="legend-item"><span class="legend-dot ${secondary?'secondary':''}"></span>${label}${value?`<span class="legend-value">${value}</span>`:''}</span>`; }
    function connection() { const offline = statusFor('network')!=='normal'; return `<div class="connection-top"><div class="connection-symbol">${icon(state.applied.network==='wifi'?'wifi':'network')}</div><div><div class="connection-name">${networkName()}</div><div class="connection-status"><span class="small-dot" style="background:${offline?'var(--muted)':'var(--good)'}"></span>演示网卡 · ${offline?stateLabels[statusFor('network')]:'已连接'}</div></div></div>`; }
    function overview() { return `${heading('系统总览','了解这一刻的资源使用情况。')}${banner('cpu')}<section class="metrics" aria-label="当前指标">${metric('cpu','CPU 使用率','%','整机占用','cpu')}${metric('memory','物理内存','GiB','共 32 GiB · '+(hasValue('memory')?'45.6%':'—'),'memory')}${metric('download','下载速度','MB/s',networkName(),'network')}${metric('upload','上传速度','KB/s',networkName(),'network')}</section><div class="overview-grid"><section class="panel"><header class="panel-header"><div><h2 class="panel-title">资源趋势</h2><p class="panel-subtitle">CPU 与物理内存的使用率</p></div>${icon('clock')}</header><div class="panel-content"><div class="legend">${legendItem('CPU',hasValue('cpu')?'18.4%':'—')}${legendItem('内存',hasValue('memory')?'45.6%':'—',true)}</div>${chart('cpu',{compare:true})}</div><div class="chart-summary"><div class="summary-item">CPU 平均<strong>${hasValue('cpu')?average('cpu')+'%':'—'}</strong></div><div class="summary-item">CPU 峰值<strong>${hasValue('cpu')?Math.max(...dataFor('cpu')).toFixed(1)+'%':'—'}</strong></div><div class="summary-item">物理内存<strong>${hasValue('memory')?'14.6 / 32 GiB':'—'}</strong></div></div></section><div class="right-stack"><section class="panel"><header class="panel-header"><h2 class="panel-title">网络流量</h2><button class="text-button" data-go="network">查看详情${icon('arrow')}</button></header><div class="panel-content"><div class="network-inline"><div><span>↓ 下载</span><strong>${numberValue('download')}<small>${hasValue('download')?'MB/s':''}</small></strong></div><div><span>↑ 上传</span><strong>${numberValue('upload')}<small>${hasValue('upload')?'KB/s':''}</small></strong></div></div>${statusFor('network')==='normal'?`<svg class="network-mini" viewBox="0 0 600 170" preserveAspectRatio="none" role="img" aria-label="下载速度演示趋势"><path d="${pathFor(dataFor('download'),8)} L600,170 L0,170 Z" fill="var(--accent-soft)"/><path d="${pathFor(dataFor('download'),8)}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`:`<div style="height:65px;display:grid;place-items:center;color:var(--muted);font-size:11px">${stateLabels[statusFor('network')]} · 趋势中断</div>`}<div class="inline-muted" style="margin-top:5px">最近 ${state.range} 分钟 · 下载速率</div></div></section><section class="panel"><header class="panel-header"><h2 class="panel-title">当前连接</h2><button class="text-button" data-go="settings">更改${icon('arrow')}</button></header><div class="panel-content">${connection()}${rows([['选择方式',state.applied.network==='auto'?'自动选择':'手动指定'],['采样间隔',state.applied.interval+' 秒 / 次'],['数据范围','仅当前网卡']])}</div></section></div></div><h2 class="section-label">每个数字，都有清楚的含义</h2><section class="notes-grid" aria-label="指标说明"><div class="note-item"><h3 class="note-heading">${icon('cpu')}CPU 使用率</h3><p>整机处理器的忙碌时间占比，<br>统一显示为 0–100%。</p></div><div class="note-item"><h3 class="note-heading">${icon('memory')}物理内存</h3><p>以 GiB 显示已用量与总量，<br>在详情中保留统计口径。</p></div><div class="note-item"><h3 class="note-heading">${icon('network')}网络速率</h3><p>显示单个网卡的上下行速度，<br>不叠加其他网络接口。</p></div></section>`; }
    function cpuPage() { return `${heading('CPU','整机处理器的使用情况。')}${banner('cpu')}<section class="detail-summary"><div><div class="eyebrow">当前使用率</div><div class="detail-value number">${numberValue('cpu')}<span class="metric-unit">${hasValue('cpu')?'%':''}</span></div></div><div class="detail-meta"><div class="summary-item">最近 ${state.range} 分钟平均<strong>${hasValue('cpu')?average('cpu')+'%':'—'}</strong></div><div class="summary-item">最近 ${state.range} 分钟峰值<strong>${hasValue('cpu')?Math.max(...dataFor('cpu')).toFixed(1)+'%':'—'}</strong></div><div class="summary-item">采样间隔<strong>${state.applied.interval}<span style="font-size:11px"> 秒</span></strong></div></div></section><section class="panel detail-chart"><header class="panel-header"><div><h2 class="panel-title">CPU 使用率趋势</h2><p class="panel-subtitle">整机归一化 · 0–100%</p></div>${statusChip('cpu')}</header><div class="panel-content">${chart('cpu')}</div></section><div class="detail-bottom"><section class="panel info-block"><h2>如何理解这个数值</h2><p>显示全部逻辑处理器在采样间隔内的忙碌时间占比。它反映 CPU 的使用程度，和频率、温度是不同的指标。</p></section><section class="panel info-block"><h2>数据说明</h2><div style="margin-top:14px">${rows([['当前来源','预览样例'],['统计范围','整机'],['有效时间',hasValue('cpu')?'示例 14:32:08':'暂无有效样本']])}</div></section></div>`; }
    function memoryPage() { return `${heading('内存','物理内存的使用量与近期变化。')}${banner('memory')}<section class="detail-summary"><div><div class="eyebrow">已用物理内存</div><div class="detail-value number">${numberValue('memory')}<span class="metric-unit">${hasValue('memory')?'GiB':''}</span></div></div><div class="detail-meta"><div class="summary-item">使用率<strong>${hasValue('memory')?'45.6%':'—'}</strong></div><div class="summary-item">可用内存<strong>${hasValue('memory')?'17.4 GiB':'—'}</strong></div><div class="summary-item">总内存<strong>${hasValue('memory')?'32 GiB':'—'}</strong></div></div></section><section class="panel detail-chart"><header class="panel-header"><div><h2 class="panel-title">内存使用率趋势</h2><p class="panel-subtitle">物理内存 · 0–100%</p></div>${statusChip('memory')}</header><div class="panel-content">${chart('memory')}</div></section><div class="detail-bottom"><section class="panel info-block"><h2>物理内存分配</h2>${hasValue('memory')?`<div class="memory-meter" role="img" aria-label="${hasValue('memory')?'演示内存已用45.6%，可用54.4%':'暂无有效内存数据'}"><span style="width:${hasValue('memory')?'45.625':'0'}%"></span></div><div class="meter-legend"><span>已用 <strong>${hasValue('memory')?'14.6 GiB':'—'}</strong></span><span>可用 <strong>${hasValue('memory')?'17.4 GiB':'—'}</strong></span></div>`:`<div class="memory-unavailable">${stateLabels[statusFor('memory')]} · 暂无有效内存分配数据</div>`}</section><section class="panel info-block"><h2>统计口径</h2><p>演示口径：已用量 = 总量 − 可用量。缓存与可回收内存的含义随平台来源说明，所有容量使用二进制单位。</p></section></div>`; }
    function networkPage() { return `${heading('网络','查看一个网卡的上传与下载，不混合其他连接。')}${banner('network')}<section class="network-heading">${connection()}<button class="button" data-go="settings">更改网卡${icon('arrow')}</button></section><div class="two-charts">${[['download','下载速率','MB/s'],['upload','上传速率','KB/s']].map(([kind,label,unit])=>`<section class="panel"><header class="panel-header"><div><h2 class="panel-title">${label}</h2><div class="network-hero number">${numberValue(kind)}<span class="metric-unit">${hasValue(kind)?unit:''}</span></div></div>${icon(kind==='download'?'down':'up')}</header><div class="panel-content">${chart(kind)}</div><div class="chart-summary"><div class="summary-item">平均<strong>${hasValue(kind)?average(kind)+' '+unit:'—'}</strong></div><div class="summary-item">峰值<strong>${hasValue(kind)?Math.max(...dataFor(kind)).toFixed(kind==='download'?2:0)+' '+unit:'—'}</strong></div></div></section>`).join('')}</div><div class="detail-bottom"><section class="panel info-block"><h2>连接信息</h2><div style="margin-top:16px">${rows([['演示接口',networkName()],['选择方式',state.applied.network==='auto'?'自动选择':'手动指定'],['采样间隔',state.applied.interval+' 秒'],['网卡状态',stateLabels[statusFor('network')]]])}</div></section><section class="panel info-block"><h2>网速是怎样计算的</h2><p>使用同一个接口前后两次的字节计数差，除以实际经过的时间。切换网卡或连接恢复时重新建立基线，避免出现不真实的尖峰。</p></section></div>`; }
    function settingsPage() { const draft = state.draft; return `${heading('设置','让信息以你习惯的方式呈现。',false)}<form id="settings-form" class="settings-content"><section class="settings-section"><div class="settings-section-header"><h2>外观</h2><p>选择主题，点击应用后查看效果。</p></div><div class="theme-options">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([value,label])=>`<label class="theme-choice"><input type="radio" name="theme" value="${value}" ${draft.theme===value?'checked':''}><div class="theme-preview ${value}" aria-hidden="true"><div class="theme-preview-lines"><i></i><i></i><i></i></div></div><span class="theme-label">${label}<span class="radio-dot"></span></span></label>`).join('')}</div></section><section class="settings-section"><div class="settings-section-header"><h2>数据采样</h2><p>保持简单，只显示你需要的基础数据。</p></div><div class="settings-row"><div><div class="setting-name" id="interval-label">采样间隔</div><div class="setting-description">预览中仅展示设置后的界面文案。</div></div><div class="interval-options" role="radiogroup" aria-labelledby="interval-label">${['1','2','5'].map(value=>`<label class="interval-choice"><input type="radio" name="interval" value="${value}" ${draft.interval===value?'checked':''}><span>${value} 秒</span></label>`).join('')}</div></div><div class="settings-row"><div><label class="setting-name" for="network-select">监控网卡</label><div class="setting-description">只显示选定接口的上下行速率。</div></div><select name="network" id="network-select" class="field-select">${[['auto','自动选择（以太网）'],['ethernet','以太网 · 演示接口'],['wifi','Wi-Fi · 未连接示例']].map(([value,label])=>`<option value="${value}" ${draft.network===value?'selected':''}>${label}</option>`).join('')}</select></div></section><div class="settings-actions"><p id="settings-feedback" tabindex="-1" role="status">${isDirty()?'有尚未应用的更改':'当前设置已应用到预览'}</p><div class="button-group"><button class="button" type="button" id="reset-settings">恢复默认</button><button class="button primary" type="submit" id="apply-settings" ${isDirty()?'':'disabled'}>应用设置</button></div></div><p class="preview-notice">此预览仅用于布局，视觉与控件以 Sakani 为准。设置只作用于当前页面，不会修改系统配置，也不会开始真实采集。关闭或刷新页面后恢复默认值。</p></form>`; }
    const renderers = { overview, cpu:cpuPage, memory:memoryPage, network:networkPage, settings:settingsPage };
    function isDirty(){ return JSON.stringify(state.draft)!==JSON.stringify(state.applied); }
    function applyTheme(){ const dark=state.applied.theme==='dark'||(state.applied.theme==='system'&&prefersDark.matches); document.documentElement.dataset.theme=dark?'dark':'light'; $('#theme-toggle').innerHTML=icon(dark?'sun':'moon'); $('#theme-toggle').setAttribute('aria-label',dark?'切换到浅色主题':'切换到深色主题'); }
    function updateChrome(){ document.querySelectorAll('[data-page]').forEach(button=>{ if(button.dataset.page===state.page)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current'); }); $('#breadcrumb').textContent=labels[state.page]; $('#nav-cpu').textContent=hasValue('cpu')?'18%':'—'; $('#nav-memory').textContent=hasValue('memory')?'46%':'—'; $('#footer-state').textContent='演示数据 · '+(state.scenario==='normal'&&statusFor('network')==='offline'?'部分指标不可用':stateLabels[state.scenario]); $('#footer-dot').style.background=state.scenario==='normal'&&statusFor('network')==='normal'?'var(--good)':'var(--warning)'; $('#footer-interval').textContent=state.applied.interval+' 秒 / 次'; }
    function render(){ chartId=0; $('#content').innerHTML=renderers[state.page](); updateChrome(); }
    function goTo(page){ if(!renderers[page])return; state.page=page; if(page==='settings')state.draft={...state.applied}; render(); $('#content').scrollTop=0; $('#content h1').focus({preventScroll:true}); }
    function toast(text){ clearTimeout(toastTimer); $('#toast').textContent=text; $('#toast').hidden=false; toastTimer=setTimeout(()=>$('#toast').hidden=true,2600); }
    document.addEventListener('click',event=>{ const nav=event.target.closest('[data-page],[data-go]');if(nav){goTo(nav.dataset.page||nav.dataset.go);return;}const range=event.target.closest('[data-range]');if(range){state.range=Number(range.dataset.range);render();$(`[data-range="${state.range}"]`)?.focus();return;}if(event.target.closest('#reset-settings')){state.draft={theme:'system',interval:'1',network:'auto'};render();$('#reset-settings').focus();} });
    $('#content').addEventListener('change',event=>{if(state.page!=='settings')return;const {name,value}=event.target;if(['theme','interval','network'].includes(name)){state.draft[name]=value;$('#apply-settings').disabled=!isDirty();$('#settings-feedback').textContent=isDirty()?'有尚未应用的更改':'当前设置已应用到预览';}});
    $('#content').addEventListener('submit',event=>{if(event.target.id!=='settings-form')return;event.preventDefault();state.applied={...state.draft};applyTheme();render();$('#settings-feedback').focus({preventScroll:true});toast('已应用到当前预览，系统设置未改变');});
    $('#theme-toggle').addEventListener('click',()=>{state.applied.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';if(state.draft)state.draft.theme=state.applied.theme;applyTheme();render();});
    $('#scenario').addEventListener('change',event=>{state.scenario=event.target.value;render();});
    prefersDark.addEventListener('change',()=>{if(state.applied.theme==='system')applyTheme();});
    state.draft={...state.applied}; applyTheme(); render();
  })();
  </script>
</body>
</html>
